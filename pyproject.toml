[project]
name = "fliptuned"
version = "0.2.0"
description = "Local-first LoRA fine-tuning of small open-weight models on approved Q&A, with evaluation and chat."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{ name = "Sahil" }]
dependencies = [
    "transformers==5.21.0",
    "datasets==5.1.0",
    "safetensors>=0.8,<0.9",
    "huggingface-hub>=2.3,<3",
    "pydantic>=2.14,<3",
    "typer>=0.27,<0.28",
    "pandas>=3.1,<4",
    "openpyxl>=3.1.5,<4",
    "pyyaml>=6.0.3,<7",
    "psutil>=7.2,<8",
]

[project.optional-dependencies]
# peft/trl/accelerate require torch, so they live with the torch extras (decisions.md C5).
cpu = [
    "torch==2.14.1",
    "peft==0.21.2",
    "trl==1.16.0",
    "accelerate==1.15.0",
]
cuda = [
    "torch==2.14.1 ; sys_platform != 'darwin'",
    "peft==0.21.2 ; sys_platform != 'darwin'",
    "trl==1.16.0 ; sys_platform != 'darwin'",
    "accelerate==1.15.0 ; sys_platform != 'darwin'",
]
# QLoRA is CUDA-only; torch is pinned here too so bitsandbytes never pulls torch from PyPI.
qlora = [
    "bitsandbytes==0.50.2 ; sys_platform != 'darwin'",
    "torch==2.14.1 ; sys_platform != 'darwin'",
]
mlx = ["mlx-lm[train]==0.32.2 ; sys_platform == 'darwin' and platform_machine == 'arm64'"]
web = ["fastapi==0.162.0", "uvicorn==0.54.0"]
dev = [
    "pytest>=9.2,<10",
    "ruff==0.17.3",
    "httpx>=0.28.1,<0.29",
    "playwright==1.64.1",
    "pytest-playwright==0.10.0",
]

[project.scripts]
fliptuned = "fliptuned.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fliptuned"]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cuda" }],
    [{ extra = "cpu" }, { extra = "qlora" }],
]
# Platforms with PyTorch wheels (no Intel macOS, no Windows arm64; decisions.md §3.4).
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cuda", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu130", extra = "qlora", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".scratch", ".dev-home", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Line length is handled by `ruff format`; long user-facing strings stay unwrapped.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not tiny and not mlx and not cuda and not slow and not e2e'"
markers = [
    "tiny: downloads a tiny test model (a few MB)",
    "mlx: Apple Silicon only",
    "cuda: NVIDIA only",
    "slow: long-running",
    "e2e: Playwright against a real server",
]
